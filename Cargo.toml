[package]
name = "whitford"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A fixture-driven native Wayland mail shell"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
