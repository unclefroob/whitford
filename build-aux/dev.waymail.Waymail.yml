app-id: dev.waymail.Waymail
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: waymail
finish-args:
  - --share=ipc
  - --socket=wayland
  - --device=dri
modules:
  - name: waymail
    buildsystem: simple
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/waymail /app/bin/waymail
      - install -Dm644 data/dev.waymail.Waymail.desktop /app/share/applications/dev.waymail.Waymail.desktop
      - install -Dm644 data/dev.waymail.Waymail.metainfo.xml /app/share/metainfo/dev.waymail.Waymail.metainfo.xml
    sources:
      - type: dir
        path: ..
