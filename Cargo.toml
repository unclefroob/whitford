[package]
name = "whitford"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A lightweight native Gmail client for Wayland"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4.45", default-features = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls-tls"] }
mail-parser = { version = "0.11.9", default-features = false, features = ["full_encoding"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
unicode-segmentation = "1.13.3"
url = "2.5.8"
webkit6 = { version = "0.6.1", features = ["v2_52"] }
webpki-roots = "1.0.9"
zeroize = "1.9.0"

[profile.release]
lto = "thin"
strip = "debuginfo"
